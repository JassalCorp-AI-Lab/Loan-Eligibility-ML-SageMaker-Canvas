<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Segoe UI,system-ui,Arial,sans-serif" role="img" aria-label="Loan eligibility with SageMaker Canvas: the raw CSV is cleaned in a Data Wrangler flow with custom transforms, trained with an AutoML build and deployed as a real-time endpoint; an application calls API Gateway, Lambda cleans the input with the same transforms and invokes the endpoint">
<rect width="1280" height="720" fill="#ffffff"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/></marker>
  <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>

  <!-- icons: colored tile + white line glyph -->
  <symbol id="ic-csv" viewBox="0 0 48 48">
    <rect width="48" height="48" fill="#7AA116"/>
    <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="12" width="28" height="24" rx="2"/>
      <path d="M10 20 H38 M10 28 H38 M19.5 12 V36 M29 12 V36"/>
    </g>
  </symbol>
  <symbol id="ic-flow" viewBox="0 0 48 48">
    <rect width="48" height="48" fill="#ED7100"/>
    <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 12 H39 L28 25 V35 L20 39 V25 Z"/>
    </g>
  </symbol>
  <symbol id="ic-script" viewBox="0 0 48 48">
    <rect width="48" height="48" fill="#ED7100"/>
    <g fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 16 L8 24 L16 32 M32 16 L40 24 L32 32 M27 13 L21 35"/>
    </g>
  </symbol>
  <symbol id="ic-automl" viewBox="0 0 48 48">
    <rect width="48" height="48" fill="#C925D1"/>
    <g fill="#ffffff">
      <path d="M20 9 L22.6 17.4 L31 20 L22.6 22.6 L20 31 L17.4 22.6 L9 20 L17.4 17.4 Z"/>
      <path d="M33 26 L34.6 31.4 L40 33 L34.6 34.6 L33 40 L31.4 34.6 L26 33 L31.4 31.4 Z"/>
      <path d="M34 8 L35 11 L38 12 L35 13 L34 16 L33 13 L30 12 L33 11 Z"/>
    </g>
  </symbol>
  <symbol id="ic-endpoint" viewBox="0 0 48 48">
    <rect width="48" height="48" fill="#8C4FFF"/>
    <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round">
      <rect x="10" y="10" width="28" height="8" rx="2"/>
      <rect x="10" y="20" width="28" height="8" rx="2"/>
      <rect x="10" y="30" width="28" height="8" rx="2"/>
    </g>
    <g fill="#ffffff"><circle cx="15" cy="14" r="1.6"/><circle cx="15" cy="24" r="1.6"/><circle cx="15" cy="34" r="1.6"/></g>
    <path d="M24 14 H33 M24 24 H33 M24 34 H33" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  </symbol>
  <symbol id="ic-shield" viewBox="0 0 48 48">
    <rect width="48" height="48" fill="#8C4FFF"/>
    <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 8 L37 13 V23 C37 31 31.5 37 24 40 C16.5 37 11 31 11 23 V13 Z"/>
      <path d="M18 24 L22.5 28.5 L30.5 20"/>
    </g>
  </symbol>
  <symbol id="ic-app" viewBox="0 0 48 48">
    <rect width="48" height="48" fill="#5C4EE5"/>
    <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 11 H34 A5 5 0 0 1 39 16 V26 A5 5 0 0 1 34 31 H22 L15 37 V31 H14 A5 5 0 0 1 9 26 V16 A5 5 0 0 1 14 11 Z"/>
    </g>
    <g fill="#ffffff"><circle cx="17" cy="21" r="2"/><circle cx="24" cy="21" r="2"/><circle cx="31" cy="21" r="2"/></g>
  </symbol>
  <symbol id="ic-api" viewBox="0 0 48 48">
    <rect width="48" height="48" fill="#01A88D"/>
    <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 38 V18 L24 10 L36 18 V38"/>
      <path d="M6 26 H20 M16 22 L20 26 L16 30"/>
      <path d="M28 26 H42 M38 22 L42 26 L38 30"/>
    </g>
  </symbol>
  <symbol id="ic-lambda" viewBox="0 0 48 48">
    <rect width="48" height="48" fill="#E7157B"/>
    <g fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 11 H20 L33 37 H38 M25.5 22 L15 37"/>
    </g>
  </symbol>
  <symbol id="ic-terminal" viewBox="0 0 48 48">
    <rect width="48" height="48" fill="#7AA116"/>
    <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="11" width="32" height="26" rx="3"/>
      <path d="M14 20 L19 24 L14 28 M23 29 H32"/>
    </g>
  </symbol>
</defs>

<!-- ======================= SAGEMAKER CANVAS ======================= -->
<rect x="20" y="20" width="560" height="680" rx="14" fill="none" stroke="#232f3e" stroke-width="1.6"/>
<text x="564" y="40" text-anchor="end" font-size="12.5" font-weight="700" fill="#232f3e">SAGEMAKER CANVAS  |  build and deploy, no code</text>

<rect x="40" y="52" width="250" height="176" rx="12" fill="#F6FAEE" stroke="#7AA116" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="52" y="72" font-size="12" font-weight="700" letter-spacing="0.8" fill="#7AA116">TRAINING DATA</text>

<rect x="310" y="52" width="250" height="376" rx="12" fill="#FFF7F0" stroke="#ED7100" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="322" y="72" font-size="12" font-weight="700" letter-spacing="0.8" fill="#ED7100">DATA WRANGLER</text>

<rect x="40" y="248" width="250" height="180" rx="12" fill="#FBF0FB" stroke="#C925D1" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="52" y="268" font-size="12" font-weight="700" letter-spacing="0.8" fill="#C925D1">AUTOML TRAINING</text>

<rect x="40" y="448" width="520" height="232" rx="12" fill="#F8F4FF" stroke="#8C4FFF" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="52" y="468" font-size="12" font-weight="700" letter-spacing="0.8" fill="#8C4FFF">DEPLOYMENT</text>
<text x="300" y="664" text-anchor="middle" font-size="11.5" font-style="italic" fill="#4b5563">billed per instance-hour until the endpoint is deleted</text>

<!-- ======================= INTEGRATION ======================= -->
<rect x="600" y="20" width="400" height="680" rx="14" fill="none" stroke="#232f3e" stroke-width="1.6"/>
<text x="984" y="40" text-anchor="end" font-size="12.5" font-weight="700" fill="#232f3e">INTEGRATION  |  other applications</text>

<rect x="620" y="52" width="360" height="176" rx="12" fill="#F3F1FF" stroke="#5C4EE5" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="632" y="72" font-size="12" font-weight="700" letter-spacing="0.8" fill="#5C4EE5">YOUR APPLICATION</text>

<rect x="620" y="248" width="360" height="180" rx="12" fill="#EEF9F7" stroke="#01A88D" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="632" y="268" font-size="12" font-weight="700" letter-spacing="0.8" fill="#01A88D">API GATEWAY</text>

<rect x="620" y="448" width="175" height="232" rx="12" fill="#FFF0F6" stroke="#E7157B" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="632" y="468" font-size="12" font-weight="700" letter-spacing="0.8" fill="#E7157B">AWS LAMBDA</text>

<rect x="805" y="448" width="175" height="232" rx="12" fill="#F6FAEE" stroke="#7AA116" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="817" y="468" font-size="12" font-weight="700" letter-spacing="0.8" fill="#7AA116">LOCAL TEST</text>

<!-- ======================= ARROWS ======================= -->
<!-- 1 CSV -> data flow -->
<path fill="none" stroke="#232f3e" stroke-width="2" d="M250,149 L350,149" marker-end="url(#arrow)"/>
<!-- 2 data flow -> custom transforms -->
<path fill="none" stroke="#232f3e" stroke-width="2" d="M435,208 L435,290" marker-end="url(#arrow)"/>
<!-- 3 transforms -> AutoML build -->
<path fill="none" stroke="#232f3e" stroke-width="2" d="M350,349 L250,349" marker-end="url(#arrow)"/>
<!-- 4 build -> endpoint -->
<path fill="none" stroke="#232f3e" stroke-width="2" d="M165,408 L165,438 L435,438 L435,486" marker-end="url(#arrow)"/>
<!-- IAM policy -> endpoint -->
<path fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5" d="M250,545 L350,545" marker-end="url(#arrowDash)"/>
<text x="300" y="535" text-anchor="middle" font-size="10.5" font-style="italic" fill="#4b5563">allows invoke</text>
<!-- 5 app <-> API -->
<path fill="none" stroke="#232f3e" stroke-width="2" d="M800,208 L800,290" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<!-- 6 API <-> Lambda -->
<path fill="none" stroke="#232f3e" stroke-width="2" d="M770,408 L770,436 L707.5,436 L707.5,486" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<!-- 7 Lambda <-> endpoint -->
<path fill="none" stroke="#232f3e" stroke-width="2" d="M632.5,545 L520,545" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<!-- 8 test client <-> endpoint -->
<path fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5" d="M892.5,604 L892.5,630 L470,630 L470,604" marker-end="url(#arrowDash)" marker-start="url(#arrowDash)"/>

<!-- badges -->
<g font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">
  <circle cx="300" cy="149" r="11" fill="#0f1e3a" stroke="#ffffff" stroke-width="2"/><text x="300" y="153">1</text>
  <circle cx="451" cy="249" r="11" fill="#0f1e3a" stroke="#ffffff" stroke-width="2"/><text x="451" y="253">2</text>
  <circle cx="300" cy="349" r="11" fill="#0f1e3a" stroke="#ffffff" stroke-width="2"/><text x="300" y="353">3</text>
  <circle cx="300" cy="438" r="11" fill="#0f1e3a" stroke="#ffffff" stroke-width="2"/><text x="300" y="442">4</text>
  <circle cx="816" cy="249" r="11" fill="#0f1e3a" stroke="#ffffff" stroke-width="2"/><text x="816" y="253">5</text>
  <circle cx="738" cy="436" r="11" fill="#0f1e3a" stroke="#ffffff" stroke-width="2"/><text x="738" y="440">6</text>
  <circle cx="576" cy="545" r="11" fill="#0f1e3a" stroke="#ffffff" stroke-width="2"/><text x="576" y="549">7</text>
  <circle cx="700" cy="630" r="11" fill="#6b7280" stroke="#ffffff" stroke-width="2"/><text x="700" y="634">8</text>
</g>

<!-- ======================= CARDS ======================= -->
<g text-anchor="middle">
  <rect x="80" y="90" width="170" height="118" rx="10" fill="#ffffff" stroke="#7AA116" stroke-width="2"/>
  <use href="#ic-csv" x="143" y="100" width="44" height="44"/>
  <text x="165" y="164" font-size="13" font-weight="700" fill="#16191f">Raw CSV</text>
  <text x="165" y="181" font-size="11" fill="#5f6b7a">loan_applications_raw.csv</text>
  <text x="165" y="195" font-size="11" fill="#5f6b7a">50,000 rows x 10 columns</text>

  <rect x="350" y="90" width="170" height="118" rx="10" fill="#ffffff" stroke="#ED7100" stroke-width="2"/>
  <use href="#ic-flow" x="413" y="100" width="44" height="44"/>
  <text x="435" y="164" font-size="13" font-weight="700" fill="#16191f">Data flow</text>
  <text x="435" y="181" font-size="11" fill="#5f6b7a">every column as text</text>
  <text x="435" y="195" font-size="11" fill="#5f6b7a">drop duplicates and ID</text>

  <rect x="350" y="290" width="170" height="118" rx="10" fill="#ffffff" stroke="#ED7100" stroke-width="2"/>
  <use href="#ic-script" x="413" y="300" width="44" height="44"/>
  <text x="435" y="364" font-size="13" font-weight="700" fill="#16191f">Custom transforms</text>
  <text x="435" y="381" font-size="11" fill="#5f6b7a">01_clean_columns.py</text>
  <text x="435" y="395" font-size="11" fill="#5f6b7a">02_add_debt_to_income.py</text>

  <rect x="80" y="290" width="170" height="118" rx="10" fill="#ffffff" stroke="#C925D1" stroke-width="2"/>
  <use href="#ic-automl" x="143" y="300" width="44" height="44"/>
  <text x="165" y="364" font-size="13" font-weight="700" fill="#16191f">AutoML build</text>
  <text x="165" y="381" font-size="11" fill="#5f6b7a">Quick: 78.8% accuracy</text>
  <text x="165" y="395" font-size="11" fill="#5f6b7a">Standard: 79.9% accuracy</text>

  <rect x="80" y="486" width="170" height="118" rx="10" fill="#ffffff" stroke="#8C4FFF" stroke-width="2"/>
  <use href="#ic-shield" x="143" y="496" width="44" height="44"/>
  <text x="165" y="560" font-size="13" font-weight="700" fill="#16191f">IAM policy</text>
  <text x="165" y="577" font-size="11" fill="#5f6b7a">InvokeEndpoint only</text>
  <text x="165" y="591" font-size="11" fill="#5f6b7a">iam_invoke_policy.json</text>

  <rect x="350" y="486" width="170" height="118" rx="10" fill="#ffffff" stroke="#8C4FFF" stroke-width="2"/>
  <use href="#ic-endpoint" x="413" y="496" width="44" height="44"/>
  <text x="435" y="560" font-size="13" font-weight="700" fill="#16191f">Real-time endpoint</text>
  <text x="435" y="577" font-size="11" fill="#5f6b7a">loan-eligibility-endpoint</text>
  <text x="435" y="591" font-size="11" fill="#5f6b7a">1 x ml.t2.xlarge</text>

  <rect x="715" y="90" width="170" height="118" rx="10" fill="#ffffff" stroke="#5C4EE5" stroke-width="2"/>
  <use href="#ic-app" x="778" y="100" width="44" height="44"/>
  <text x="800" y="164" font-size="13" font-weight="700" fill="#16191f">Loan app or chatbot</text>
  <text x="800" y="181" font-size="11" fill="#5f6b7a">sends raw applicant JSON</text>
  <text x="800" y="195" font-size="11" fill="#5f6b7a">gets decision + probability</text>

  <rect x="715" y="290" width="170" height="118" rx="10" fill="#ffffff" stroke="#01A88D" stroke-width="2"/>
  <use href="#ic-api" x="778" y="300" width="44" height="44"/>
  <text x="800" y="364" font-size="13" font-weight="700" fill="#16191f">HTTP API</text>
  <text x="800" y="381" font-size="11" fill="#5f6b7a">POST /predict</text>
  <text x="800" y="395" font-size="11" fill="#5f6b7a">HTTPS from anywhere</text>

  <rect x="632.5" y="486" width="150" height="118" rx="10" fill="#ffffff" stroke="#E7157B" stroke-width="2"/>
  <use href="#ic-lambda" x="685.5" y="496" width="44" height="44"/>
  <text x="707.5" y="560" font-size="13" font-weight="700" fill="#16191f">lambda_function.py</text>
  <text x="707.5" y="577" font-size="11" fill="#5f6b7a">cleans with the same</text>
  <text x="707.5" y="591" font-size="11" fill="#5f6b7a">transform files</text>

  <rect x="817.5" y="486" width="150" height="118" rx="10" fill="#ffffff" stroke="#7AA116" stroke-width="2"/>
  <use href="#ic-terminal" x="870.5" y="496" width="44" height="44"/>
  <text x="892.5" y="560" font-size="13" font-weight="700" fill="#16191f">invoke_endpoint.py</text>
  <text x="892.5" y="577" font-size="11" fill="#5f6b7a">test client on</text>
  <text x="892.5" y="591" font-size="11" fill="#5f6b7a">your machine</text>
</g>

<!-- ======================= STEP PANEL ======================= -->
<rect x="1020" y="20" width="240" height="680" rx="12" fill="#f3f8fd" stroke="#0972d3" stroke-width="1.6"/>
<text x="1036" y="48" font-size="15" font-weight="700" fill="#16191f">How it works</text>

<g>
  <circle cx="1047" cy="78" r="10" fill="#0f1e3a"/><text x="1047" y="82" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">1</text>
  <text x="1064" y="82" font-size="12.5" font-weight="700" fill="#16191f">CSV → data flow</text>
  <text x="1064" y="98" font-size="11" fill="#4b5563">import the raw file as a</text>
  <text x="1064" y="112" font-size="11" fill="#4b5563">Canvas dataset, all text</text>

  <circle cx="1047" cy="140" r="10" fill="#0f1e3a"/><text x="1047" y="144" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">2</text>
  <text x="1064" y="144" font-size="12.5" font-weight="700" fill="#16191f">Flow → transforms</text>
  <text x="1064" y="160" font-size="11" fill="#4b5563">Python cleans messy values</text>
  <text x="1064" y="174" font-size="11" fill="#4b5563">and adds debt_to_income</text>

  <circle cx="1047" cy="202" r="10" fill="#0f1e3a"/><text x="1047" y="206" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">3</text>
  <text x="1064" y="206" font-size="12.5" font-weight="700" fill="#16191f">Transforms → AutoML</text>
  <text x="1064" y="222" font-size="11" fill="#4b5563">Canvas tries models on the</text>
  <text x="1064" y="236" font-size="11" fill="#4b5563">clean data, keeps the best</text>

  <circle cx="1047" cy="264" r="10" fill="#0f1e3a"/><text x="1047" y="268" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">4</text>
  <text x="1064" y="268" font-size="12.5" font-weight="700" fill="#16191f">Build → endpoint</text>
  <text x="1064" y="284" font-size="11" fill="#4b5563">deploy the model as a</text>
  <text x="1064" y="298" font-size="11" fill="#4b5563">real-time endpoint</text>

  <circle cx="1047" cy="326" r="10" fill="#0f1e3a"/><text x="1047" y="330" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">5</text>
  <text x="1064" y="330" font-size="12.5" font-weight="700" fill="#16191f">App ↔ API Gateway</text>
  <text x="1064" y="346" font-size="11" fill="#4b5563">HTTPS POST /predict with</text>
  <text x="1064" y="360" font-size="11" fill="#4b5563">raw applicant values</text>

  <circle cx="1047" cy="388" r="10" fill="#0f1e3a"/><text x="1047" y="392" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">6</text>
  <text x="1064" y="392" font-size="12.5" font-weight="700" fill="#16191f">API Gateway ↔ Lambda</text>
  <text x="1064" y="408" font-size="11" fill="#4b5563">runs the same transform</text>
  <text x="1064" y="422" font-size="11" fill="#4b5563">files used in Canvas</text>

  <circle cx="1047" cy="450" r="10" fill="#0f1e3a"/><text x="1047" y="454" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">7</text>
  <text x="1064" y="454" font-size="12.5" font-weight="700" fill="#16191f">Lambda ↔ endpoint</text>
  <text x="1064" y="470" font-size="11" fill="#4b5563">sends one CSV row, returns</text>
  <text x="1064" y="484" font-size="11" fill="#4b5563">decision and probability</text>

  <circle cx="1047" cy="512" r="10" fill="#6b7280"/><text x="1047" y="516" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">8</text>
  <text x="1064" y="516" font-size="12.5" font-weight="700" fill="#16191f">Test client ↔ endpoint</text>
  <text x="1064" y="532" font-size="11" fill="#4b5563">call the endpoint directly</text>
  <text x="1064" y="546" font-size="11" fill="#4b5563">from your machine</text>
</g>

<line x1="1036" y1="576" x2="1244" y2="576" stroke="#cfe0f5" stroke-width="1.4"/>
<path fill="none" stroke="#232f3e" stroke-width="2" d="M1038,600 L1078,600" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="1088" y="604" font-size="11.5" fill="#38414d">main flow</text>
<path fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5" d="M1038,626 L1078,626" marker-end="url(#arrowDash)" marker-start="url(#arrowDash)"/>
<text x="1088" y="630" font-size="11.5" fill="#38414d">optional or permission</text>
<text x="1036" y="664" font-size="10.5" fill="#5f6b7a">Same cleaning code in Canvas</text>
<text x="1036" y="679" font-size="10.5" fill="#5f6b7a">and in Lambda: no skew.</text>
</svg>
