<text x="1036" y="50" font-size="16" font-weight="700" fill="#16191f">How it works</text>
<circle cx="1047" cy="75" r="11" fill="#0f1e3a"/><text x="1047" y="79.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="1065" y="80" font-size="14" font-weight="700" fill="#16191f">CSV → Data Wrangler</text><text x="1065" y="98" font-size="13" fill="#4b5563">upload the raw file,</text><text x="1065" y="115" font-size="13" fill="#4b5563">every column as text</text>
<circle cx="1047" cy="134" r="11" fill="#0f1e3a"/><text x="1047" y="138.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="1065" y="139" font-size="14" font-weight="700" fill="#16191f">Flow → transforms</text><text x="1065" y="157" font-size="13" fill="#4b5563">Python cleans values,</text><text x="1065" y="174" font-size="13" fill="#4b5563">adds debt_to_income</text>
<circle cx="1047" cy="193" r="11" fill="#0f1e3a"/><text x="1047" y="197.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><text x="1065" y="198" font-size="14" font-weight="700" fill="#16191f">Transforms → AutoML</text><text x="1065" y="216" font-size="13" fill="#4b5563">Canvas tries models</text><text x="1065" y="233" font-size="13" fill="#4b5563">and keeps the best</text>
<circle cx="1047" cy="252" r="11" fill="#0f1e3a"/><text x="1047" y="256.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><text x="1065" y="257" font-size="14" font-weight="700" fill="#16191f">AutoML → endpoint</text><text x="1065" y="275" font-size="13" fill="#4b5563">deploy the model for</text><text x="1065" y="292" font-size="13" fill="#4b5563">real-time predictions</text>
<circle cx="1047" cy="311" r="11" fill="#0f1e3a"/><text x="1047" y="315.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text><text x="1065" y="316" font-size="14" font-weight="700" fill="#16191f">App ↔ API Gateway</text><text x="1065" y="334" font-size="13" fill="#4b5563">HTTPS POST /predict</text><text x="1065" y="351" font-size="13" fill="#4b5563">with raw values</text>
<circle cx="1047" cy="370" r="11" fill="#0f1e3a"/><text x="1047" y="374.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text><text x="1065" y="375" font-size="14" font-weight="700" fill="#16191f">API Gateway ↔ Lambda</text><text x="1065" y="393" font-size="13" fill="#4b5563">Lambda cleans input</text><text x="1065" y="410" font-size="13" fill="#4b5563">with the same files</text>
<circle cx="1047" cy="429" r="11" fill="#0f1e3a"/><text x="1047" y="433.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">7</text><text x="1065" y="434" font-size="14" font-weight="700" fill="#16191f">Lambda ↔ endpoint</text><text x="1065" y="452" font-size="13" fill="#4b5563">one CSV row in,</text><text x="1065" y="469" font-size="13" fill="#4b5563">decision out</text>
<circle cx="1047" cy="488" r="11" fill="#6b7280"/><text x="1047" y="492.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">8</text><text x="1065" y="493" font-size="14" font-weight="700" fill="#16191f">Test client ↔ endpoint</text><text x="1065" y="511" font-size="13" fill="#4b5563">call the endpoint</text><text x="1065" y="528" font-size="13" fill="#4b5563">from your machine</text>
